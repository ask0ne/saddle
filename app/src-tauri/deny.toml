# cargo-deny policy. Run: cargo deny check   (from app/src-tauri)
[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
yanked = "deny"
# `unic-*` is pulled in by tauri-utils -> urlpattern and is unmaintained
# upstream with no safe upgrade. Not exploitable here (no untrusted URL
# patterns are parsed). Revisit when Tauri drops it.
ignore = [
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range via tauri-utils; unmaintained, no fix" },
  { id = "RUSTSEC-2025-0080", reason = "unic-common via tauri-utils; unmaintained, no fix" },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property via tauri-utils; unmaintained, no fix" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version via tauri-utils; unmaintained, no fix" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident via tauri-utils; unmaintained, no fix" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
# Tauri's tree legitimately carries duplicate major versions.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
