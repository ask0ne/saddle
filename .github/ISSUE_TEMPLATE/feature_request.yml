name: Feature request
description: Suggest an idea for Saddle
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: markdown
    attributes:
      value: |
        Saddle is macOS-only and targets Terminal.app. Requests for other terminals or platforms are welcome as discussion, but are out of scope for now.
